server:
  port: 9099

spring:
  application:
    name: gateway-server
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://config-server:8088/}"

  cloud:
    gateway:
      routes:
        - id: product-service
          uri: lb://PRODUCT
          predicates:
            - Path=/api/v1/products/**
          filters:
            - name: CircuitBreaker
              args:
                name: product-cb
                fallbackUri: forward:/fallback/product

      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka-server:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: gateway-server
    prefer-ip-address: false

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always